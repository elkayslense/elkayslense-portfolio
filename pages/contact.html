    <main id="main">
        <section class="contact">
            <h1 class="section-title">Get in Touch</h1>

            <div class="contact-form">
                <!-- Set data-endpoint to a Formspree URL (https://formspree.io/f/xxxx) to receive messages by email.
                     Left empty, the form opens WhatsApp with the message pre-filled. -->
                <form id="contactForm" data-endpoint="">
                    <div class="field">
                        <label for="name">Your name</label>
                        <input type="text" id="name" name="name" autocomplete="name" required>
                    </div>
                    <div class="field">
                        <label for="email">Your email</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="session">Type of session</label>
                        <select id="session" name="session">
                            <option value="portrait">Portrait</option>
                            <option value="event">Wedding &amp; Event</option>
                            <option value="branding">Branding &amp; Commercial</option>
                            <option value="creative">Creative shoot</option>
                            <option value="other">Something else</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="message">Your message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>
                    <input class="honeypot" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
                    <button type="submit" class="btn">Send Message</button>
                    <p class="form-status" role="status" aria-live="polite"></p>
                    <noscript><p>JavaScript is needed for this form. Please call or use WhatsApp below.</p></noscript>
                </form>

                <div class="contact-info">
                    <p><strong>Email:</strong> <a href="mailto:elkayslense1@gmail.com">elkayslense1@gmail.com</a></p>
                    <p><strong>Phone:</strong> <a href="tel:+2348120248809">+2348120248809</a></p>
                    <p><strong>Follow me</strong></p>
                    <div class="social-links">
                        <a href="https://instagram.com/elkayslense_" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="../assets/icons/instagram.svg" alt="" width="45" height="45"></a>
                        <a href="https://facebook.com/elkayslense" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><img src="../assets/icons/facebook.svg" alt="" width="45" height="45"></a>
                        <a href="https://x.com/elkayslense" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)"><img src="../assets/icons/x.svg" alt="" width="45" height="45"></a>
                        <a href="https://wa.me/2348120248809" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><img src="../assets/icons/whatsapp.svg" alt="" width="45" height="45"></a>
                    </div>
                </div>
            </div>
        </section>
